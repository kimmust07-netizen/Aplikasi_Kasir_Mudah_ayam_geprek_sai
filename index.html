<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Outlet & Katalog WhatsApp</title>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        .screen {
            display: none;
            min-height: 100vh;
        }

        .screen.active {
            display: block;
        }

        /* --- 1. LANDING SCREEN / HALAMAN AWAL --- */
        #landing-screen {
            background: #ffffff;
            padding-bottom: 30px;
        }

        .hero-banner {
            position: relative;
            height: 220px;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .hero-banner h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hero-banner p {
            font-size: 13px;
            opacity: 0.9;
        }

        .outlet-selection-box {
            max-width: 500px;
            margin: -20px auto 0 auto;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            position: relative;
            z-index: 10;
            width: 90%;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .outlet-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .outlet-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .outlet-card:hover, .outlet-card:active {
            background: #e8f5e9;
            border-color: #2e7d32;
        }

        .outlet-info h4 {
            font-size: 14px;
            color: #2c3e50;
        }

        .outlet-info p {
            font-size: 11px;
            color: #6c757d;
            margin-top: 2px;
        }

        .badge-wa {
            background: #25d366;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- 2. KASIR & MENU SCREEN --- */
        .app-header {
            background: #007bff;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .active-outlet-name {
            font-size: 14px;
            font-weight: 600;
        }

        .btn-wa-catalog {
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Card Visual Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .menu-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #eee;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
        }

        .menu-card:active {
            transform: scale(0.98);
        }

        .menu-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .menu-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .menu-details h4 {
            font-size: 13px;
            color: #333;
            margin-bottom: 4px;
        }

        .menu-details .price {
            color: #007bff;
            font-weight: bold;
            font-size: 13px;
        }

        /* --- RINCIAN BELANJA --- */
        .cart-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .cart-list {
            min-height: 60px;
            max-height: 160px;
            overflow-y: auto;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .empty-cart {
            color: #888;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
        }

        .cart-footer {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }

        .btn-checkout {
            background: #25d366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-checkout:active {
            background: #1ebd56;
        }
    </style>
</head>
<body>

    <!-- 1. HALAMAN AWAL (BANNER & PILIHAN OUTLET) -->
    <div id="landing-screen" class="screen active">
        <div class="hero-banner">
            <h1>RESTO & CAFE OUTLET</h1>
            <p>Pilih outlet terdekat untuk melihat menu & memesan</p>
        </div>

        <div class="outlet-selection-box">
            <div class="section-title">
                <i class="fa-solid fa-store" style="color: #007bff;"></i>
                Pilih Cabang Outlet
            </div>
            <div class="outlet-grid" id="outlet-grid">
                <!-- 10 Outlet dirender otomatis via JS -->
            </div>
        </div>
    </div>

    <!-- 2. HALAMAN MENU KASIR OUTLET -->
    <div id="kasir-screen" class="screen">
        <header class="app-header">
            <div class="header-left">
                <button class="btn-back" onclick="goToLanding()"><i class="fa-solid fa-arrow-left"></i></button>
                <div>
                    <div class="active-outlet-name" id="current-outlet-title">Outlet Name</div>
                </div>
            </div>
            <!-- Link ke Katalog WhatsApp Asli Outlet -->
            <a href="#" id="wa-catalog-link" target="_blank" class="btn-wa-catalog">
                <i class="fa-brands fa-whatsapp"></i> Katalog WA
            </a>
        </header>

        <div class="container">
            <section class="menu-section">
                <div class="section-title">
                    <i class="fa-solid fa-utensils" style="color: #007bff;"></i>
                    Daftar Menu & Harga
                </div>
                <div class="menu-grid" id="menu-grid">
                    <!-- Dynamic rendering gambar & menu -->
                </div>
            </section>

            <section class="cart-section">
                <div class="section-title">
                    <i class="fa-solid fa-cart-shopping" style="color: #007bff;"></i>
                    Rincian Pesanan
                </div>
                <div class="cart-list" id="cart-list">
                    <p class="empty-cart">Klik menu di atas untuk menambahkan.</p>
                </div>
                
                <div class="cart-footer">
                    <div class="total-box">
                        <span>Total Belanja:</span>
                        <strong id="total-price" style="color: #2e7d32;">Rp 0</strong>
                    </div>
                    <button class="btn-checkout" onclick="kirimKeWhatsApp()">
                        <i class="fa-brands fa-whatsapp"></i> Kirim Pesanan ke WA Outlet
                    </button>
                </div>
            </section>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>

                    { name: "Matcha Latte Premium", price: 22000, img: "https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=300&q=80" },
                    { name: "French Fries Gourmet", price: 18000, img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=300&q=80" }
                ]
            },
            {
                id: 3,
                name: "Outlet 03 - Bandung Kota",
                address: "Jl. Riau No. 88",
                phone: "6281234567892",
                catalogUrl: "https://wa.me/c/6281234567892",
                menu: [
                    { name: "Nasi Goreng Rempah", price: 20000, img: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=300&q=80" },
                    { name: "Teh Tarik Bandung", price: 12000, img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=300&q=80" },

                ]

            {
                id: 4,
                name: "Outlet 04 - Surabaya Gubeng",
                address: "Jl. Pemuda No. 15",
                phone: "6281234567893",
                catalogUrl: "https://wa.me/c/6281234567893",
                menu: [
                    { name: "Nasi Goreng Jowo", price: 18000, img: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=300&q=80" },
                    { name: "Es Sinom Segar", price: 8000, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=300&q=80" },
                    { name: "Rawon Daging Premium", price: 30000, img: "https://images.unsplash.com/photo-1541832676-9b763b0239ab?auto=format&fit=crop&w=300&q=80" }
                ]
            },
            {
                id: 5,
                name: "Outlet 05 - Yogyakarta",
                address: "Jl. Malioboro No. 101",
                phone: "6281234567894",
                catalogUrl: "https://wa.me/c/6281234567894",
                menu: [
                    { name: "Nasi Goreng Telur", price: 15000, img: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=300&q=80" },

                    { name: "Ayam Geprek Jogja", price: 16000, img: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?auto=format&fit=crop&w=300&q=80" }
                ]
            },
            {

                phone: "6281234567895",

            },
            {

                name: "Outlet 07 - Medan Baru",
                address: "Jl. Gajah Mada No. 22",

                    { name: "Kopi Sidikalang", price: 12000, img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=300&q=80" }
                ]
            },
            {
                id: 8,
                name: "Outlet 08 - Semarang Tengah",
                address: "Jl. Pandanaran No. 70",
                phone: "6281234567897",
                catalogUrl: "https://wa.me/c/6281234567897",
                menu: [
                    { name: "Nasi Goreng Babat", price: 23000, img: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=300&q=80" },
                    { name: "Es Es Kelapa Jeruk", price: 10000, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=300&q=80" }
                ]
            },
            {
                id: 9,
                name: "Outlet 09 - Malang",
                address: "Jl. Soekarno Hatta No. 9",
                phone: "6281234567898",
                catalogUrl: "https://wa.me/c/6281234567898",
                menu: [
                    { name: "Nasi Goreng Bakso", price: 19000, img: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=300&q=80" },
                    { name: "Cokelat Klasik Malang", price: 11000, img: "https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=300&q=80" }
                ]
            },
            {
                id: 10,
                name: "Outlet 10 - Makassar",
                address: "Jl. Losari No. 3",
                phone: "6281234567899",
                catalogUrl: "https://wa.me/c/6281234567899",
                menu: [
                    { name: "Nasi Goreng Coto", price: 24000, img: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=300&q=80" },
                    { name: "Es Markisa Fresh", price: 12000, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=300&q=80" }
                ]
            }
        ];

        let selectedOutlet = null;
        let cart = [];

        // --- RENDER DAFTAR OUTLET DI LANDING ---
        function renderOutletList() {
            const grid = document.getElementById("outlet-grid");
            grid.innerHTML = "";
            outlets.forEach(outlet => {
                grid.innerHTML += `
                    <div class="outlet-card" onclick="selectOutlet(${outlet.id})">
                        <div class="outlet-info">
                            <h4>${outlet.name}</h4>
                            <p>${outlet.address}</p>
                        </div>
                        <div class="badge-wa">
                            Pilih <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>
                `;
            });
        }

        // --- SAAT OUTLET DIPIIH ---
        function selectOutlet(id) {
            selectedOutlet = outlets.find(o => o.id === id);
            cart = []; // Reset keranjang

            // Update UI Header Kasir
            document.getElementById("current-outlet-title").innerText = selectedOutlet.name;
            document.getElementById("wa-catalog-link").href = selectedOutlet.catalogUrl;

            // Pindah Layar & Render Menu Sesuai Outlet
            document.getElementById("landing-screen").classList.remove("active");
            document.getElementById("kasir-screen").classList.add("active");
            
            renderMenu();
            updateCartUI();
        }

        function goToLanding() {
            document.getElementById("kasir-screen").classList.remove("active");
            document.getElementById("landing-screen").classList.add("active");
        }

        // --- RENDER MENU & HARGA KHUSUS OUTLET ---
        function renderMenu() {
            const grid = document.getElementById("menu-grid");
            grid.innerHTML = "";

            selectedOutlet.menu.forEach(item => {
                grid.innerHTML += `
                    <div class="menu-card" onclick="addToCart('${item.name}', ${item.price})">
                        <img src="${item.img}" class="menu-img" alt="${item.name}">
                        <div class="menu-details">
                            <h4>${item.name}</h4>
                            <div class="price">Rp ${item.price.toLocaleString('id-ID')}</div>
                        </div>
                    </div>
                `;
            });
        }

        // --- KERANJANG BELANJA ---
        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById("cart-list");
            const totalPriceEl = document.getElementById("total-price");
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p class="empty-cart">Klik menu di atas untuk menambahkan.</p>';
                totalPriceEl.innerText = 'Rp 0';
                return;
            }

            cartList.innerHTML = "";
            let total = 0;

            cart.forEach((item) => {
                total += item.price;
                cartList.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <strong>Rp ${item.price.toLocaleString('id-ID')}</strong>
                    </div>
                `;
            });

            totalPriceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        // --- KIRIM STRUK KE WA OUTLET DIINCAR ---
        function kirimKeWhatsApp() {
            if (cart.length === 0) {
                alert("Pilih minimal satu menu terlebih dahulu!");
                return;
            }

            let pesan = `*-- PESANAN MASUK [${selectedOutlet.name}] --*\n\n`;
            let total = 0;
            cart.forEach((item, index) => {
                pesan += `${index + 1}. ${item.name} - Rp ${item.price.toLocaleString('id-ID')}\n`;
                total += item.price;
            });
            pesan += `\n*TOTAL: Rp ${total.toLocaleString('id-ID')}*\n\n`;
            pesan += "Mohon konfirmasi dan segera diproses, terima kasih!";

            const encodedPesan = encodeURIComponent(pesan);
            const waUrl = `https://wa.me/${selectedOutlet.phone}?text=${encodedPesan}`;

            // Buka WhatsApp
            window.open(waUrl, '_blank');
        }

        // Inisialisasi saat pertama kali dibuka
        renderOutletList();
    </script>
</body>
</html>
