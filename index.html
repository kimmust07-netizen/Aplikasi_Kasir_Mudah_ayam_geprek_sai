<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Outlet</title>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ==================== DESAIN / CSS ==================== -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        .screen {
            display: none;
            min-height: 100vh;
        }

        .screen.active {
            display: block;
        }

        /* --- LANDING SCREEN / HALAMAN AWAL --- */
        #landing-screen {
            background: linear-gradient(135deg, #007bff, #00d2ff);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .landing-content {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }

        .logo-box {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .landing-content h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .landing-content p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .btn-start {
            background: #28a745;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            transition: transform 0.2s;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- HEADER KASIR --- */
        .app-header {
            background: #007bff;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-back {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* --- CONTAINER & MENU --- */
        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #555;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-card:active {
            background: #eef5ff;
        }

        .menu-card h4 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .menu-card .price {
            color: #007bff;
            font-weight: bold;
            font-size: 14px;
        }

        /* --- RINCIAN BELANJA --- */
        .cart-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .cart-list {
            min-height: 80px;
            max-height: 180px;
            overflow-y: auto;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .empty-cart {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-top: 25px;
        }

        .cart-footer {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
        }

        .btn-checkout {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-checkout:active {
            background: #218838;
        }

        /* --- MODAL PILIH OUTLET WA --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-desc {
            font-size: 13px;
            color: #666;
        }

        .outlet-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-outlet {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #e8f5e9;
            color: #2e7d32;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid #c8e6c9;
            transition: background 0.2s;
        }

        .btn-outlet:active {
            background: #c8e6c9;
        }
    </style>
</head>
<body>

    <!-- HALAMAN UTAMA / LANDING SCREEN -->
    <div id="landing-screen" class="screen active">
        <div class="landing-content">
            <div class="logo-box">
                <i class="fa-solid fa-store"></i>
            </div>
            <h1>SELAMAT DATANG</h1>
            <p>Sistem Kasir & Pemesanan Ringkas Outlet</p>
            <button class="btn-start" onclick="goToMenu()">
                <i class="fa-solid fa-cart-shopping"></i> Masuk Ke Menu Kasir
            </button>
        </div>
    </div>

    <!-- HALAMAN MENU KASIR -->
    <div id="kasir-screen" class="screen">
        <header class="app-header">
            <button class="btn-back" onclick="goToLanding()"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>Kasir Penjualan</h2>
        </header>

        <div class="container">
            <!-- Grid Menu -->
            <section class="menu-section">
                <h3>Pilih Menu</h3>
                <div class="menu-grid" id="menu-grid">
                    <!-- Dynamic rendering -->
                </div>
            </section>

            <!-- Ringkasan Belanja -->
            <section class="cart-section">
                <h3>Rincian Pesanan</h3>
                <div class="cart-list" id="cart-list">
                    <p class="empty-cart">Belum ada item dipilih.</p>
                </div>
                
                <div class="cart-footer">
                    <div class="total-box">
                        <span>Total:</span>
                        <strong id="total-price">Rp 0</strong>
                    </div>
                    <button class="btn-checkout" onclick="prosesSelesai()">
                        <i class="fa-solid fa-receipt"></i> Selesaikan Pesanan
                    </button>
                </div>
            </section>
        </div>
    </div>

    <!-- MODAL / POPUP PILIH WA CABANG -->
    <div id="outlet-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-brands fa-whatsapp"></i> Kirim Ke WA Outlet</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <p class="modal-desc">Pilih cabang outlet terdekat untuk mengirimkan rincian pesanan:</p>
            
            <div class="outlet-list" id="outlet-list">
                <!-- 10 WA Outlet dirender lewat JavaScript -->
            </div>
        </div>
    </div>

    <!-- ==================== LOGIKA / JAVASCRIPT ==================== -->
    <script>
        // --- DATA MENU ---
        const menuData = [
            { id: 1, name: "Nasi Goreng Spesial", price: 20000 },
            { id: 2, name: "Mie Goreng Jumbo", price: 18000 },
            { id: 3, name: "Ayam Bakar + Nasi", price: 25000 },
            { id: 4, name: "Es Teh Manis", price: 5000 },
            { id: 5, name: "Kopi Hitam", price: 6000 },
            { id: 6, name: "Ayam Geprek", price: 22000 }
        ];

        // --- DATA 10 CABANG OUTLET WA (Ganti nomor HP berikut) ---
        const outletList = [
            { name: "Outlet 01 - Jakarta Pusat", phone: "6281234567890" },
            { name: "Outlet 02 - Jakarta Selatan", phone: "6281234567891" },
            { name: "Outlet 03 - Jakarta Barat", phone: "6281234567892" },
            { name: "Outlet 04 - Bandung Kota", phone: "6281234567893" },
            { name: "Outlet 05 - Surabaya Gubeng", phone: "6281234567894" },
            { name: "Outlet 06 - Medan Baru", phone: "6281234567895" },
            { name: "Outlet 07 - Semarang Tengah", phone: "6281234567896" },
            { name: "Outlet 08 - Yogyakarta", phone: "6281234567897" },
            { name: "Outlet 09 - Malang", phone: "6281234567898" },
            { name: "Outlet 10 - Bali Denpasar", phone: "6281234567899" }
        ];

        let cart = [];

        // --- NAVIGASI HALAMAN ---
        function goToMenu() {
            document.getElementById("landing-screen").classList.remove("active");
            document.getElementById("kasir-screen").classList.add("active");
            renderMenu();
        }

        function goToLanding() {
            document.getElementById("kasir-screen").classList.remove("active");
            document.getElementById("landing-screen").classList.add("active");
        }

        // --- RENDER MENU ---
        function renderMenu() {
            const grid = document.getElementById("menu-grid");
            grid.innerHTML = "";
            menuData.forEach(item => {
                grid.innerHTML += `
                    <div class="menu-card" onclick="addToCart('${item.name}', ${item.price})">
                        <h4>${item.name}</h4>
                        <div class="price">Rp ${item.price.toLocaleString('id-ID')}</div>
                    </div>
                `;
            });
        }

        // --- LOGIKA KERANJANG ---
        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById("cart-list");
            const totalPriceEl = document.getElementById("total-price");
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p class="empty-cart">Belum ada item dipilih.</p>';
                totalPriceEl.innerText = 'Rp 0';
                return;
            }

            cartList.innerHTML = "";
            let total = 0;

            cart.forEach((item) => {
                total += item.price;
                cartList.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <strong>Rp ${item.price.toLocaleString('id-ID')}</strong>
                    </div>
                `;
            });

            totalPriceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        // --- PROSES DAN PILIH OUTLET ---
        function prosesSelesai() {
            if (cart.length === 0) {
                alert("Pilih minimal satu menu terlebih dahulu!");
                return;
            }
            renderOutlets();
            document.getElementById("outlet-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("outlet-modal").style.display = "none";
        }

        function renderOutlets() {
            const container = document.getElementById("outlet-list");
            container.innerHTML = "";

            // Format Pesan Struk untuk WhatsApp
            let pesan = "*-- STRUK PESANAN PENJUALAN --*\n\n";
            let total = 0;
            cart.forEach((item, index) => {
                pesan += `${index + 1}. ${item.name} - Rp ${item.price.toLocaleString('id-ID')}\n`;
                total += item.price;
            });
            pesan += `\n*TOTAL: Rp ${total.toLocaleString('id-ID')}*\n\n`;
            pesan += "Mohon segera diproses, terima kasih!";

            const encodedPesan = encodeURIComponent(pesan);

            // Menampilkan 10 Tombol WA Outlet
            outletList.forEach(outlet => {
                const waLink = `https://wa.me/${outlet.phone}?text=${encodedPesan}`;
                container.innerHTML += `
                    <a href="${waLink}" target="_blank" class="btn-outlet" onclick="closeModal()">
                        <span><i class="fa-brands fa-whatsapp"></i> ${outlet.name}</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </a>
                `;
            });
        }
    </script>
</body>
</html>
